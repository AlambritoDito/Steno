[project]
name = "steno"
version = "1.0.0-beta.1"
description = "Real-time local transcription for classes and meetings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.31.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper==1.2.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "ctranslate2==4.6.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    # CTranslate2 4.6 imports pkg_resources, removed by setuptools 82.
    "setuptools==80.9.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "av==16.1.0",
    "huggingface-hub==1.5.0",
    "tqdm==4.67.3",
    "psutil==7.0.0",
    "packaging==26.0",
    "sounddevice==0.5.5",
    "numpy==2.4.2",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "websockets==16.0",
    "python-multipart==0.0.22",
    "aiofiles==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "httpx-ws==0.8.2",
]
build = ["pyinstaller==6.20.0", "pillow==12.1.1"]

[project.urls]
Homepage = "https://github.com/AlambritoDito/Steno"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
